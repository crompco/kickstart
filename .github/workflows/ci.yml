name: CI

on:
  push:
    branches:
      - master
      - v3.x
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        tz:
          - UTC
          - America/New_York
          - Asia/Tokyo

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint
        if: matrix.tz == 'UTC'

      - run: yarn build

      - run: yarn test
